<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المنيو</title>
    <style>
        body {
            margin: 0;
            padding: 20px 10px;
            background-color: #121212; /* خلفية داكنة لإبراز المنيو */
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px; /* المسافة بين الصورتين */
        }

        img {
            max-width: 100%;
            height: auto;
            border-radius: 8px; /* حواف دائرية خفيفة */
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5); /* ظل خفيف حول الصور */
            display: block;
        }
    </style>
</head>
<body>

    <img src="menu.jpg" alt="المنيو - الصفحة الأولى">
    <img src="menuu.jpg" alt="المنيو - الصفحة الثانية">

</body>
</html>
